name: Choreo Auto Deploy to Production

on:
  repository_dispatch:
    types:
      - choreo-ready-for-production
  workflow_dispatch:
    inputs:
      expected_image_tag:
        description: 'Expected image tag (without -amd64 suffix), for example: release-v0.9.x-a1b2c3d'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: choreo-production-${{ github.event_name }}-${{ github.event.client_payload.source_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: windows-latest
    env:
      CHOREO_PROJECT: ${{ vars.CHOREO_PROJECT }}
      CHOREO_COMPONENT: ${{ vars.CHOREO_COMPONENT }}
      CHOREO_ORG: ${{ vars.CHOREO_ORG }}
      CHOREO_DEPLOYMENT_TRACK: ${{ vars.CHOREO_DEPLOYMENT_TRACK }}
      CHOREO_DEV_ENV: ${{ vars.CHOREO_DEV_ENV }}
      CHOREO_PROD_ENV: ${{ vars.CHOREO_PROD_ENV }}
      EXPECTED_IMAGE_TAG: ${{ github.event.client_payload.image_tag || inputs.expected_image_tag }}
    steps:
      - name: Validate required configuration
        shell: pwsh
        env:
          CHOREO_TOKEN: ${{ secrets.CHOREO_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOREO_TOKEN)) {
            throw "Missing required secret: CHOREO_TOKEN"
          }
          if ([string]::IsNullOrWhiteSpace($env:CHOREO_PROJECT)) {
            throw "Missing required repository variable: CHOREO_PROJECT"
          }
          if ([string]::IsNullOrWhiteSpace($env:CHOREO_COMPONENT)) {
            throw "Missing required repository variable: CHOREO_COMPONENT"
          }
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_IMAGE_TAG)) {
            throw "Missing expected image tag from dispatch payload or manual input."
          }

      - name: Install Choreo CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/wso2/choreo-cli/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "windows-amd64" -and $_.name -like "*.zip" } | Select-Object -First 1
          if (-not $asset) {
            throw "Failed to find Windows choreo CLI asset in latest release."
          }

          $installDir = Join-Path $env:USERPROFILE ".choreo\\bin"
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null

          $zipPath = Join-Path $env:RUNNER_TEMP "choreo.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $installDir -Force
          $installDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve CLI binary
        id: cli
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cli = Get-Command choreo -ErrorAction SilentlyContinue
          if (-not $cli) {
            $cli = Get-Command wdp -ErrorAction SilentlyContinue
          }
          if (-not $cli) {
            throw "Neither 'choreo' nor 'wdp' CLI is available after install."
          }

          "path=$($cli.Source)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          & $cli.Source --version

      - name: Login, wait for Development, then deploy to Production
        shell: pwsh
        env:
          CHOREO_TOKEN: ${{ secrets.CHOREO_TOKEN }}
          CHOREO_CLI: ${{ steps.cli.outputs.path }}
        run: |
          $ErrorActionPreference = "Stop"

          $devEnv = if ([string]::IsNullOrWhiteSpace($env:CHOREO_DEV_ENV)) { "Development" } else { $env:CHOREO_DEV_ENV }
          $prodEnv = if ([string]::IsNullOrWhiteSpace($env:CHOREO_PROD_ENV)) { "Production" } else { $env:CHOREO_PROD_ENV }
          $expectedTag = "$($env:EXPECTED_IMAGE_TAG)-amd64"
          $orgArg = if ([string]::IsNullOrWhiteSpace($env:CHOREO_ORG)) { "" } else { "--org=$($env:CHOREO_ORG)" }
          $trackArg = if ([string]::IsNullOrWhiteSpace($env:CHOREO_DEPLOYMENT_TRACK)) { "" } else { "--deployment-track=$($env:CHOREO_DEPLOYMENT_TRACK)" }
          $commitHint = ""
          if ($env:EXPECTED_IMAGE_TAG -match "([0-9a-fA-F]{7,40})$") {
            $commitHint = $Matches[1]
          }

          if ([string]::IsNullOrWhiteSpace($env:CHOREO_ORG)) {
            Write-Output "CHOREO_ORG is not set; using token default organization."
            $env:CHOREO_TOKEN | & $env:CHOREO_CLI login --with-token --non-interactive
          } else {
            $env:CHOREO_TOKEN | & $env:CHOREO_CLI login --with-token --org $env:CHOREO_ORG --non-interactive
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          # PAT login mode does not support `change-org`; pass --org on each command instead.

          $buildId = ""
          $ready = $false

          for ($i = 1; $i -le 90; $i++) {
            $describeArgs = @("describe", "deployment", "--component=$($env:CHOREO_COMPONENT)", "--project=$($env:CHOREO_PROJECT)", "--env=$devEnv")
            if ($orgArg -ne "") { $describeArgs += $orgArg }
            if ($trackArg -ne "") { $describeArgs += $trackArg }
            $out = (& $env:CHOREO_CLI @describeArgs 2>&1 | Out-String)
            Write-Output $out

            $idMatches = [regex]::Matches($out, "(?i)build[\s_-]*id\s*[:=]\s*([A-Za-z0-9._:-]+)")
            if ($idMatches.Count -gt 0) {
              $buildId = $idMatches[$idMatches.Count - 1].Groups[1].Value
              Write-Output "Detected build id candidate: $buildId"
            }

            $hasEnv = $out -match [regex]::Escape($devEnv)
            $hasTag = $out.Contains($expectedTag)
            $hasSuccess = $out -match "(?i)(successful|active|ready|deployed)"
            $hasFailure = $out -match "(?i)(failed|error|canceled|cancelled)"

            if ($hasEnv -and $hasTag -and $hasSuccess) {
              Write-Output "Development environment is ready on expected image tag: $expectedTag"
              $ready = $true
              break
            }

            if ($hasEnv -and $hasTag -and $hasFailure) {
              throw "Development build/deploy failed for expected image tag: $expectedTag"
            }

            Write-Output "Development is not ready on $expectedTag yet (attempt $i/90), wait 20s..."
            Start-Sleep -Seconds 20
          }

          if (-not $ready) {
            throw "Timed out waiting for Development readiness on expected image tag."
          }

          if ([string]::IsNullOrWhiteSpace($buildId)) {
            Write-Output "Build ID not found in deployment details; fallback to list builds."
            $listArgs = @("list", "builds", "--component=$($env:CHOREO_COMPONENT)", "--project=$($env:CHOREO_PROJECT)", "--non-interactive")
            if ($orgArg -ne "") { $listArgs += $orgArg }
            if ($trackArg -ne "") { $listArgs += $trackArg }
            $buildsOut = (& $env:CHOREO_CLI @listArgs 2>&1 | Out-String)
            Write-Output $buildsOut

            $lines = $buildsOut -split "`r?`n"
            $buildRows = @()

            foreach ($line in $lines) {
              $trim = $line.Trim()
              if (-not ($trim -match "^\d+")) { continue }

              $parts = [regex]::Split($trim, "\s{2,}")
              if ($parts.Count -lt 4) { continue }
              if (-not ($parts[0] -match "^\d+$")) { continue }

              $buildRows += [PSCustomObject]@{
                BuildId = $parts[0]
                Status  = $parts[1].ToLowerInvariant()
                Commit  = $parts[3].ToLowerInvariant()
                Raw     = $trim
              }
            }

            if (-not [string]::IsNullOrWhiteSpace($commitHint)) {
              foreach ($row in $buildRows) {
                if ($row.Commit.Contains($commitHint.ToLowerInvariant()) -and $row.Status -eq "success") {
                  $buildId = $row.BuildId
                  Write-Output "Matched build ID by commit hint '$commitHint': $buildId"
                  break
                }
              }
            }

            if ([string]::IsNullOrWhiteSpace($buildId)) {
              $firstSuccess = $buildRows | Where-Object { $_.Status -eq "success" } | Select-Object -First 1
              if ($firstSuccess) {
                $buildId = $firstSuccess.BuildId
                Write-Output "Using latest successful build ID fallback: $buildId"
              }
            }

            if ([string]::IsNullOrWhiteSpace($buildId)) {
              $firstAny = $buildRows | Select-Object -First 1
              if ($firstAny) {
                $buildId = $firstAny.BuildId
                Write-Output "Using latest visible build ID fallback: $buildId"
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($buildId)) {
            throw "Development is ready but Build ID is still unavailable after fallback; cannot create Production deployment non-interactively. Check list builds output format and CHOREO_DEPLOYMENT_TRACK."
          }

          $deployArgs = @("create", "deployment", $env:CHOREO_COMPONENT, "--env=$prodEnv", "--project=$($env:CHOREO_PROJECT)", "--build-id=$buildId")
          if ($orgArg -ne "") { $deployArgs += $orgArg }
          if ($trackArg -ne "") { $deployArgs += $trackArg }
          & $env:CHOREO_CLI @deployArgs
          exit $LASTEXITCODE
