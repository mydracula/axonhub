# Publish Docker image
# Copy from new-api 
# https://github.com/QuantumNous/new-api/blob/main/.github/workflows/docker-image-arm64.yml

name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      update_test_branch_for_choreo:
        description: 'Update test branch Dockerfile(s) to pin the new amd64 image tag for Choreo auto build'
        required: false
        type: boolean
        default: false

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      packages: write
      contents: read

    steps:
      - name: Check out (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve tag & write VERSION
        run: |
          git fetch --tags --force --depth=1
          RAW_TAG=${GITHUB_REF#refs/tags/}
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          fi
          TAG=$(echo "$RAW_TAG" | tr '/:@' '-' | tr -cd 'A-Za-z0-9_.-')
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "$TAG" > internal/build/VERSION
          echo "Building tag: $TAG for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}

      - name: Build & push single-arch (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.TAG }}-${{ matrix.arch }}
            ghcr.io/${{ github.repository }}:latest-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  create_manifests:
    name: Create multi-arch manifests (GHCR)
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Extract tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create & push manifest (GHCR - version)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:${TAG} \
            ghcr.io/${{ github.repository }}:${TAG}-amd64 \
            ghcr.io/${{ github.repository }}:${TAG}-arm64

      - name: Create & push manifest (GHCR - latest)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:latest-amd64 \
            ghcr.io/${{ github.repository }}:latest-arm64

  update_test_branch_for_choreo:
    name: Update test branch image pin for Choreo
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_test_branch_for_choreo }}
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          RAW_TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          fi
          TAG="$(echo "$RAW_TAG" | tr '/:@' '-' | tr -cd 'A-Za-z0-9_.-')"
          if [[ -z "$TAG" ]]; then
            echo "Failed to resolve image tag from ref: $RAW_TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Update Dockerfile image tags
        id: update_files
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          image_ref="ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}-amd64"
          files=(Dockerfile Dockerfile-choreo)

          for f in "${files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "Missing expected file in test branch: $f"
              exit 1
            fi

            # Pin the runtime base image to an immutable tag instead of latest-amd64.
            sed -i -E "s|^FROM[[:space:]]+ghcr\\.io/mydracula/axonhub:[^[:space:]]+|FROM ${image_ref}|g" "$f"
          done

          if git diff --quiet -- Dockerfile Dockerfile-choreo; then
            echo "No changes in Dockerfile(s); skip commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile Dockerfile-choreo
          git commit -m "chore(choreo): pin image to ${IMAGE_TAG}-amd64 [skip ci]"
          git push origin HEAD:test
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch Choreo auto deploy workflow
        if: ${{ steps.update_files.outputs.changed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg image_tag "$IMAGE_TAG" \
            --arg source_run_id "${GITHUB_RUN_ID}" \
            --arg source_sha "${GITHUB_SHA}" \
            '{event_type:"choreo-ready-for-production",client_payload:{image_tag:$image_tag,source_run_id:$source_run_id,source_sha:$source_sha}}')"

          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d "$payload"
